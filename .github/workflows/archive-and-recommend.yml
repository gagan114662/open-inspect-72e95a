name: Archive and Recommend

# Closes the specific gap named in docs/production-hardening-backlog.md
# item #4's self-improvement work: scripts/detect-recurring-pattern.py could
# already derive a target-vs-mechanism recommendation from
# docs/self-improvement-archive.jsonl's accumulated evidence, but something
# still had to run it and decide whether to act on the result. That
# "when to act" decision was a human/agent judgment call made by reading
# the archive. This workflow makes it automatic, but ONLY for two
# deliberately bounded actions: proposing an append-only audit entry to the
# archive AS A PULL REQUEST (never a direct push — a human still merges
# it), and opening a tracking issue. It never merges, deploys, or touches
# secrets, and requests no secrets.
#
# History: the first draft of this workflow computed "newly crossed
# threshold" purely in memory against the static on-disk archive, never
# persisting the round. Codex's review of that draft found the real
# consequence: two separate PRs that each contribute one finding on the
# same topic never combine, because each is compared against the same
# unchanged baseline in isolation -- evidence never actually accumulates
# across PRs. scripts/archive-round.py fixes this by appending each
# processed round to the archive, tagged with the PR commit SHA it came
# from. The first version of this fix pushed that change directly to the
# default branch; Claude Code's own auto-mode classifier correctly refused
# that ("Merge Without Review") -- an automated direct push to the default
# branch is exactly the review-bypass pattern this whole hardening effort
# has otherwise never allowed itself, even for "just data". The archive
# update is proposed as a PR instead, same as every other change in this
# repo's history.
# The same Codex review also found that filtering PR comments by their
# opening text alone lets any PR commenter forge a fake "Codex independent
# review" comment; this workflow now requires both the posting account to
# be github-actions[bot] AND the comment to carry the exact head-SHA marker
# .github/workflows/codex-review.yml embeds, binding the analyzed comment
# to the specific commit this workflow_run was triggered by.
#
# Runs after "Codex Review" (.github/workflows/codex-review.yml) completes.
# Uses `workflow_run`, not `pull_request`: workflow_run always executes the
# workflow file AND checks out source from the repository's default
# branch, never the PR's own commits -- so, unlike codex-review.yml, this
# workflow has no PR-authored-script trust boundary to manage. It requests
# no secrets: everything it reads (the posted review comment, the archive
# file) is already-redacted, already-public PR content.
# Second real finding from that same Codex review, on a live re-review of
# this file: each run only compares the archive against ITS OWN new round.
# If two separate PRs are each mid-flight proposing an archive-round PR
# (neither merged yet), each run sees only its own addition and neither
# reports a crossing — even if merging both together would cross it. The
# `push` trigger below closes that: once any archive-round PR actually
# merges into main, this re-evaluates the FULL merged archive from
# scratch and opens an issue for any topic at/above threshold that
# doesn't already have one open. It reuses the same open-issue dedup by
# title, so this is not a second, different mechanism -- it's the same
# check, run again with fresher data, exactly the "next cycle sees the
# prior cycle's persisted decision" property this file exists to prove.
on:
  workflow_run:
    workflows: ["Codex Review"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "docs/self-improvement-archive.jsonl"
      # A revised policy (new topic, restored weight) can cross the
      # mechanism-fix threshold on the existing archive; re-evaluate then
      # too (Codex review of PR #10, round 31).
      - "docs/improvement-policy.json"
      # A registry change (a tool now covers a topic) changes which drafts
      # are eligible (Codex review of PR #61, round 2).
      - "tools/manifest.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  analyze:
    name: Analyze review for recurring patterns
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0] != null
    # Real finding from a second Codex review: a single repo-wide
    # concurrency group meant that if PR-A's review run was in progress
    # and PR-B's review run was already queued behind it, PR-C's review
    # completing would cancel PR-B's still-pending run outright (GitHub
    # Actions keeps only the newest pending run per group when
    # cancel-in-progress is false) -- silently dropping PR-B's round
    # instead of ever archiving it. Scoping the group per PR keeps
    # same-PR reruns serialized (the original purpose: don't let two runs
    # for the same PR review race past the dedup checks) without
    # different PRs' runs ever cancelling each other's queue slot.
    concurrency:
      group: archive-and-recommend-analyze-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout (default branch — trusted)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "self-improvement-archive" \
            --color "0e8a16" \
            --description "Automated archive-round PR from archive-and-recommend.yml" \
            --force
          gh label create "self-improvement-recommendation" \
            --color "b60205" \
            --description "Automatically opened: a finding topic crossed the mechanism-fix recurrence threshold" \
            --force

      - name: Fetch the bot-authored, SHA-bound Codex review comment
        id: fetch-comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            const headSha = context.payload.workflow_run.head_sha;
            const marker = `<!-- codex-review-sha: ${headSha} -->`;

            // The loop's own pull requests (archive rounds, evidence refreshes,
            // policy proposals) are one data file each; reviewing them yields
            // clean rounds that would count toward a policy's evaluation period
            // for free. Their reviews are never archived.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            const head = pr.data.head.ref || "";
            if (
              pr.data.user?.login === "github-actions[bot]" ||
              /^(archive-rounds-pr-|improvement-policy-proposal$|improvement-evidence-refresh$)/.test(head)
            ) {
              console.log(`PR #${prNumber} (${head}) is the loop's own; its review is not archived.`);
              core.setOutput("found", "false");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            // All three checks matter: the author check stops a PR commenter
            // from forging a review-shaped comment; the SHA marker stops
            // an old (correctly bot-authored) review comment from a prior
            // commit being mistaken for this run's review; and the marker
            // must be the comment's LAST line — the footer the workflow
            // itself appends — so a marker quoted inside another commit's
            // review text cannot claim that review for this SHA (Codex
            // full-branch review, workflows finding 1).
            const reviewComments = comments.filter(
              (c) =>
                (c.body || "").startsWith("### Codex independent review") &&
                (c.body || "").trimEnd().endsWith(marker) &&
                c.user?.type === "Bot" &&
                c.user?.login === "github-actions[bot]"
            );

            if (reviewComments.length === 0) {
              core.setOutput("found", "false");
              return;
            }

            const latest = reviewComments[reviewComments.length - 1];
            const fs = require("fs");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/review-comment.txt", latest.body, "utf8");
            core.setOutput("found", "true");
            core.setOutput("pr-number", String(prNumber));
            core.setOutput("head-sha", headSha);

      - name: Archive this round (in the working tree) and check for newly-crossed thresholds
        id: archive
        if: steps.fetch-comment.outputs.found == 'true'
        run: |
          python3 scripts/archive-round.py \
            docs/self-improvement-archive.jsonl \
            "$RUNNER_TEMP/review-comment.txt" \
            "${{ steps.fetch-comment.outputs.head-sha }}" \
            --target "PR #${{ steps.fetch-comment.outputs.pr-number }} diff" \
            > "$RUNNER_TEMP/archive-result.json"
          cat "$RUNNER_TEMP/archive-result.json"

      - name: Propose the archived round as a pull request
        if: steps.fetch-comment.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.fetch-comment.outputs.head-sha }}
          PR_NUMBER: ${{ steps.fetch-comment.outputs.pr-number }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/self-improvement-archive.jsonl; then
            echo "No archive changes to propose (already processed, or no findings)."
            exit 0
          fi

          # ONE standing branch per reviewed pull request, rebuilt from the
          # default branch on every run by scripts/merge-archive-rounds.py:
          # the default branch's archive, then the rounds this branch already
          # holds, then this round, renumbered in order and identified by the
          # reviewed commit. Fifty reviews of one PR in a day are fifty lines
          # in one PR, never fifty PRs, and the branch never needs "Update
          # branch" because it is always the default branch plus lines.
          default_branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          branch="archive-rounds-pr-${PR_NUMBER}"
          tail -n 1 docs/self-improvement-archive.jsonl > "$RUNNER_TEMP/new-round.jsonl"
          git checkout -- docs/self-improvement-archive.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Two writers (this job and the rebuild job) force-push the same
          # branch. Each push is leased on the commit it read; a lost lease
          # means the other writer landed first, so refetch, merge again and
          # retry, never overwrite (Codex review of PR #49, finding 1).
          for attempt in 1 2 3 4; do
            if git fetch origin "$branch" 2>/dev/null; then
              lease=$(git rev-parse FETCH_HEAD)
              git show FETCH_HEAD:docs/self-improvement-archive.jsonl > "$RUNNER_TEMP/standing.jsonl" || : > "$RUNNER_TEMP/standing.jsonl"
            else
              lease=""
              : > "$RUNNER_TEMP/standing.jsonl"
            fi
            python3 scripts/merge-archive-rounds.py \
              docs/self-improvement-archive.jsonl "$RUNNER_TEMP/standing.jsonl" \
              "$RUNNER_TEMP/new-round.jsonl" "$RUNNER_TEMP/merged.jsonl" > "$RUNNER_TEMP/merge-result.json"
            cat "$RUNNER_TEMP/merge-result.json"
            if [ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["changed"])' "$RUNNER_TEMP/merge-result.json")" != "True" ]; then
              echo "The standing branch already holds this round — nothing to push."
              break
            fi
            git checkout -B "$branch"
            cp "$RUNNER_TEMP/merged.jsonl" docs/self-improvement-archive.jsonl
            git add docs/self-improvement-archive.jsonl
            rounds=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["rounds"]))' "$RUNNER_TEMP/merge-result.json")
            git commit -q -m "chore: archive ${rounds} review round(s) of PR #${PR_NUMBER}"
            if git push --force-with-lease="refs/heads/${branch}:${lease}" origin "$branch"; then
              break
            fi
            echo "Lease lost on attempt ${attempt}; refetching and merging again."
            git checkout -q "$(git rev-parse HEAD~1)" 2>/dev/null || git checkout -q --detach
            sleep $((attempt * 3))
          done

          # Same-repository PRs only (a fork branch of the same name is not ours).
          existing_pr=$(gh pr list --head "$branch" --base "$default_branch" --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr carries PR #${PR_NUMBER}'s archived rounds; updated in place."
            exit 0
          fi
          gh pr create \
            --title "chore: archive review rounds of PR #${PR_NUMBER}" \
            --body "Automatically proposed by [\`archive-and-recommend.yml\`](../blob/main/.github/workflows/archive-and-recommend.yml): every Codex review of PR #${PR_NUMBER} appends one round here (latest: commit \`${SOURCE_SHA}\`). Append-only audit-log entries — no code or workflow behavior changes. Rebuilt from the default branch on every run, so it never needs updating; a human still reviews and merges it, same as every other change in this repo." \
            --label "self-improvement-archive" \
            --base "$default_branch" \
            --head "$branch"

      - name: Open a tracking issue for each newly-crossed topic
        if: steps.fetch-comment.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const prNumber = "${{ steps.fetch-comment.outputs.pr-number }}";
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/archive-result.json", "utf8");
            const { newly_crossed: newlyCrossed } = JSON.parse(raw);

            if (!newlyCrossed || newlyCrossed.length === 0) {
              console.log("No topic newly crossed the mechanism-fix threshold. Nothing to do.");
              return;
            }

            for (const item of newlyCrossed) {
              const title = `Recurring pattern: ${item.topic} — mechanism-level fix recommended`;

              // Idempotency: don't open a second issue for a topic that
              // already has an open tracking issue.
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: "self-improvement-recommendation",
                per_page: 100,
              });
              if (existing.some((issue) => issue.title === title)) {
                console.log(`Issue already open for topic "${item.topic}" — skipping.`);
                continue;
              }

              const body = [
                `Automatically opened by [\`archive-and-recommend.yml\`](../blob/main/.github/workflows/archive-and-recommend.yml).`,
                ``,
                `A finding topic newly crossed the mechanism-level-fix recurrence`,
                `threshold in \`docs/self-improvement-archive.jsonl\`, as of the`,
                `Codex review on PR #${prNumber}.`,
                ``,
                `**Topic:** \`${item.topic}\``,
                `**Recommended action:** ${item.recommended_action}-level fix`,
                ``,
                `Run \`python3 scripts/detect-recurring-pattern.py docs/self-improvement-archive.jsonl\``,
                `for the full evidence trail (which rounds, which findings) behind this`,
                `recommendation.`,
                ``,
                `This issue was opened automatically. Deciding what the mechanism-level`,
                `fix should be, and merging/deploying it, remains a human decision — this`,
                `workflow never merges, deploys, or touches secrets; the archive update`,
                `itself is a proposed pull request, not a direct commit.`,
              ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["self-improvement-recommendation"],
              });
              console.log(`Opened tracking issue for topic "${item.topic}".`);
            }

  rebuild-archive-branches:
    name: Rebuild open archive branches on the merged archive
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # When one archive PR merges, every other open archive-rounds-pr-* branch
    # still claims the round number that just landed and shows a conflict
    # that would never clear (its own PR may already be merged, so no review
    # run will rebuild it). Rebuild each on the new default branch with
    # scripts/merge-archive-rounds.py; a branch that would not change is
    # left alone.
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: archive-and-recommend-rebuild
      cancel-in-progress: false
    steps:
      - name: Checkout (default branch — trusted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild each open archive branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          default_branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          : > "$RUNNER_TEMP/empty.jsonl"
          # --limit 1000: gh's default of 30 would silently skip older archive
          # PRs (Codex review of PR #49, finding 2).
          for branch in $(gh pr list --state open --base "$default_branch" --limit 1000 \
              --json headRefName,isCrossRepository \
              --jq '.[] | select(.isCrossRepository == false) | .headRefName | select(startswith("archive-rounds-pr-"))'); do
            for attempt in 1 2 3 4; do
              git fetch origin "$branch" || break
              lease=$(git rev-parse FETCH_HEAD)
              git show FETCH_HEAD:docs/self-improvement-archive.jsonl > "$RUNNER_TEMP/standing.jsonl" || : > "$RUNNER_TEMP/standing.jsonl"
              python3 scripts/merge-archive-rounds.py \
                docs/self-improvement-archive.jsonl "$RUNNER_TEMP/standing.jsonl" \
                "$RUNNER_TEMP/empty.jsonl" "$RUNNER_TEMP/merged.jsonl" > "$RUNNER_TEMP/merge-result.json"
              if cmp -s "$RUNNER_TEMP/merged.jsonl" "$RUNNER_TEMP/standing.jsonl"; then
                echo "$branch: already on the current archive."
                break
              fi
              rounds=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["rounds"]))' "$RUNNER_TEMP/merge-result.json")
              git checkout -q -B "$branch" "origin/$default_branch"
              cp "$RUNNER_TEMP/merged.jsonl" docs/self-improvement-archive.jsonl
              git add docs/self-improvement-archive.jsonl
              # Every round already on the default branch: the branch has
              # nothing left to propose; leave it for its PR to be closed
              # rather than failing the loop (Codex review of PR #49, finding 3).
              if git diff --cached --quiet; then
                echo "$branch: all of its rounds are already on the default branch; nothing to rebuild."
                git checkout -q "origin/$default_branch"
                break
              fi
              git commit -q -m "chore: archive ${rounds} review round(s) (rebuilt on the current default branch)"
              # Leased on the commit this run read: if the analyze job pushed a
              # newer round meanwhile, refetch and merge again instead of
              # overwriting it (Codex review of PR #49, finding 1).
              if git push --force-with-lease="refs/heads/${branch}:${lease}" origin "$branch"; then
                echo "$branch: rebuilt with ${rounds} round(s)."
                git checkout -q "origin/$default_branch"
                break
              fi
              echo "$branch: lease lost on attempt ${attempt}; retrying."
              git checkout -q "origin/$default_branch"
              sleep $((attempt * 3))
            done
          done

  reevaluate-on-merge:
    name: Re-evaluate thresholds after an archive-round PR merges
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Narrower than the workflow-level grant above: this job only reads the
    # merged archive and opens issues, never proposes or pushes a branch.
    permissions:
      contents: read
      issues: write
    # Merges to main are rare relative to PR review runs, and this job's
    # only shared risk (the issue-creation dedup race) isn't PR-scoped, so
    # a single group here is fine — unlike `analyze`, there's no "different
    # PRs shouldn't cancel each other" dimension to preserve.
    concurrency:
      group: archive-and-recommend-reevaluate
      cancel-in-progress: false
    steps:
      - name: Checkout (default branch — trusted)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure required labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "self-improvement-recommendation" \
            --color "b60205" \
            --description "Automatically opened: a finding topic crossed the mechanism-fix recurrence threshold" \
            --force

      - name: Recompute recommendations against the merged archive
        id: detect
        run: |
          python3 scripts/detect-recurring-pattern.py docs/self-improvement-archive.jsonl \
            > "$RUNNER_TEMP/detect-output.txt"
          cat "$RUNNER_TEMP/detect-output.txt"
          awk '/^---$/{found=1; next} found' "$RUNNER_TEMP/detect-output.txt" > "$RUNNER_TEMP/detect-result.json"

      - name: Open a tracking issue for any topic at or above threshold
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const raw = fs.readFileSync(process.env.RUNNER_TEMP + "/detect-result.json", "utf8");
            const { recommendations } = JSON.parse(raw);

            const atThreshold = (recommendations || []).filter(
              (r) => r.recommended_action === "mechanism"
            );
            if (atThreshold.length === 0) {
              console.log("No topic is at or above the mechanism-fix threshold. Nothing to do.");
              return;
            }

            for (const item of atThreshold) {
              const title = `Recurring pattern: ${item.topic} — mechanism-level fix recommended`;

              // Same dedup as the per-review job: a topic already tracked
              // by an open issue is not re-opened just because this merge
              // re-confirms it's still at/above threshold.
              const existing = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: "self-improvement-recommendation",
                per_page: 100,
              });
              if (existing.some((issue) => issue.title === title)) {
                console.log(`Issue already open for topic "${item.topic}" — skipping.`);
                continue;
              }

              const body = [
                `Automatically opened by [\`archive-and-recommend.yml\`](../blob/main/.github/workflows/archive-and-recommend.yml)`,
                `after an archive-round pull request merged into the default branch.`,
                ``,
                `**Topic:** \`${item.topic}\``,
                `**Recurrence:** ${item.recurrence_count} round(s): ${JSON.stringify(item.rounds)}`,
                ``,
                `This crossing may have resulted from combining two or more separately`,
                `proposed archive-round PRs, each of which individually stayed under`,
                `threshold — the per-review check only sees its own new round, so this`,
                `merge-triggered re-evaluation is what catches that combined case.`,
                ``,
                `Run \`python3 scripts/detect-recurring-pattern.py docs/self-improvement-archive.jsonl\``,
                `for the full evidence trail behind this recommendation.`,
                ``,
                `This issue was opened automatically. Deciding what the mechanism-level`,
                `fix should be, and merging/deploying it, remains a human decision — this`,
                `workflow never merges, deploys, or touches secrets.`,
              ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["self-improvement-recommendation"],
              });
              console.log(`Opened tracking issue for topic "${item.topic}".`);
            }

  propose-tools:
    name: Draft a tool for each uncovered recurring class
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # The agent cannot create tools on the fly: scripts/ and tools/ are
    # fixed infrastructure its write guard refuses. It can ASK: for every
    # topic the detector recommends a mechanism-level fix for that no
    # registered tool covers, scripts/propose-tool.py drafts a tested
    # pre-push check under proposals/tools/<topic>/ and this job proposes
    # it on ONE standing branch. Codex reviews it; a human promotes it.
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: archive-and-recommend-propose-tools
      cancel-in-progress: false
    steps:
      - name: Checkout (default branch — trusted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draft proposals on the standing branch and propose them as one pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          default_branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          branch="tool-proposals"
          withdraw_stale_pr() {
            # A standing proposal PR whose topics are no longer eligible is
            # withdrawn, not left open (Codex review of PR #61, finding 2).
            local stale_pr
            stale_pr=$(gh pr list --head "$branch" --base "$default_branch" --state open \
              --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
            if [ -n "$stale_pr" ]; then
              gh pr close "$stale_pr" --delete-branch \
                --comment "Withdrawn: on the current archive no uncovered finding class crosses the mechanism-fix threshold, so these drafts no longer apply."
              echo "Closed the stale tool-proposal PR #$stale_pr."
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$default_branch"
          # Every line of Python this privileged job executes, and every
          # reviewed input it reads (archive, policy, registry), comes from
          # a separate checkout of the DEFAULT branch. The standing branch
          # is only the output tree: a change to the generator committed
          # there is never run with this job's write token (Codex review of
          # PR #61, round 9).
          trusted="$RUNNER_TEMP/trusted"
          rm -rf "$trusted"
          git worktree prune
          git worktree add -q "$trusted" "origin/$default_branch"
          trap 'git worktree remove --force "$trusted" 2>/dev/null || true' EXIT
          # The standing branch is a shared workspace: a human may have
          # committed implementation fixes to a draft on it during review.
          # Rebuilding it from the default branch and force-pushing threw
          # those away (Codex review of PR #61, round 8). Instead: start
          # from the EXISTING branch, bring the default branch in, draft on
          # top (propose-tool.py leaves every folder it no longer owns by
          # content hash untouched), and push leased on the commit this run
          # read, retrying on a lost lease exactly like the archive branch.
          topics=""
          for attempt in 1 2 3; do
            git fetch -q origin "$default_branch"
            if git fetch -q origin "$branch" 2>/dev/null; then
              lease=$(git rev-parse "origin/$branch")
              git checkout -q -B "$branch" "origin/$branch"
              if ! git merge -q --no-edit "origin/$default_branch"; then
                # A conflict is a human's to resolve. Nothing is rebuilt and
                # nothing is pushed: the branch stays exactly as they left
                # it (Codex review of PR #61, round 9).
                git merge --abort
                echo "::warning::$branch has a merge conflict with $default_branch; nothing was pushed. Resolve the conflict on $branch by hand (or delete the branch to let the next run rebuild it)."
                exit 0
              fi
            else
              lease=""
              git checkout -q -B "$branch" "origin/$default_branch"
            fi
            # Every Python invocation here is isolated (-I): the working
            # tree is the standing branch, and a branch-authored json.py on
            # sys.path would otherwise run with the write token (Codex
            # review of PR #61, round 10). The generator and its imports
            # come from the trusted default-branch worktree.
            python3 -I "$trusted/scripts/propose-tool.py" \
              "$trusted/docs/self-improvement-archive.jsonl" \
              --policy "$trusted/docs/improvement-policy.json" \
              --manifest "$trusted/tools/manifest.json" \
              --out-dir "$PWD/proposals/tools" > "$RUNNER_TEMP/proposals.json"
            cat "$RUNNER_TEMP/proposals.json"
            git add -A proposals/ 2>/dev/null || true
            topics=$(cd "$trusted" && python3 -I -c 'import json,sys; print(", ".join(sorted(json.load(open(sys.argv[1]))["proposals"])))' "$RUNNER_TEMP/proposals.json")
            # Withdrawal is decided on what the branch HOLDS after drafting,
            # not on whether this run staged changes: removing the last
            # eligible draft stages deletions, which must still end in the
            # PR being closed (Codex review of PR #61, round 10).
            # No topic qualified and nothing was ever drafted: the folder may
            # not exist, which is zero remaining proposals, not a failure
            # under set -e (Codex review of PR #61, round 11).
            if [ -d proposals/tools ]; then
              remaining=$(find proposals/tools -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
            else
              remaining=0
            fi
            if git diff --cached --quiet; then
              if [ -z "$topics" ] && [ "$remaining" = 0 ]; then
                echo "No tool proposals apply."
                withdraw_stale_pr
                exit 0
              fi
              if [ -n "$lease" ] && [ "$(git rev-parse HEAD)" = "$lease" ]; then
                # Nothing to push, but the PR may still be missing: a push
                # that succeeded while `gh pr create` failed must be
                # completed by the next run, not reported as done (Codex
                # review of PR #61, round 9).
                echo "Drafts unchanged; $branch already holds them."
                break
              fi
            else
              git commit -q -m "chore(agent): propose tools for ${topics:-the current archive}"
            fi
            if git push --force-with-lease="refs/heads/${branch}:${lease}" origin "$branch"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Could not push $branch after 3 attempts; someone keeps updating it."
              exit 1
            fi
            echo "Lease lost on attempt ${attempt}; refetching and drafting again."
            git checkout -q --detach
          done
          if [ "${remaining:-0}" = 0 ]; then
            # The push above recorded the deletions; the PR they belonged to
            # is withdrawn, not left open with an empty diff.
            echo "No tool proposals remain on $branch."
            withdraw_stale_pr
            exit 0
          fi
          existing_pr=$(gh pr list --head "$branch" --base "$default_branch" --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')
          if [ -n "$existing_pr" ]; then
            echo "The open tool-proposal PR #$existing_pr tracks $branch."
            exit 0
          fi
          gh pr create \
            --title "chore(agent): proposed tools for ${topics:-the current archive}" \
            --body "Drafted by [\`scripts/propose-tool.py\`](../blob/main/scripts/propose-tool.py): each of these finding classes crossed the mechanism-fix threshold and no registered tool covers it. Each folder under \`proposals/tools/\` holds a pre-push check, its tests, a registry entry and a README with the promote steps. The agent cannot install a tool itself (\`scripts/\` and \`tools/\` are fixed infrastructure); merging this PR only accepts the drafts, and promoting one is a separate human commit. Human commits on this branch survive later drafting runs; the generator that drafts here always runs from the default branch." \
            --label "self-improvement-archive" \
            --base "$default_branch" \
            --head "$branch"
